<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1230">
<title>Lord's Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070b16;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 25%,#1d2d5c 0%,#070b16 72%)}
#app{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#000;box-shadow:0 0 80px #000a;font-size:16px}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:1.1em;text-align:center}
.scr.on{display:flex;animation:fin .25s ease-out}
@keyframes fin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes drag{0%,100%{transform:translateX(-2.4em)}50%{transform:translateX(2.4em)}}
.dim{background:linear-gradient(180deg,#050a1ccc,#0a1a3acc 60%,#050a1cee);backdrop-filter:blur(2px)}
.logo{font-weight:900;line-height:.9;letter-spacing:.02em;font-size:3.5em;text-transform:uppercase;font-family:'Arial Black',Impact,'Trebuchet MS',sans-serif;
 background:linear-gradient(180deg,#fff7c2 0%,#ffd84a 45%,#ff9d1e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:.05em #2a1450;paint-order:stroke fill;filter:drop-shadow(0 .08em 0 #2a1450) drop-shadow(0 .25em .35em #000a)}
.logo small{display:block;font-size:.5em;letter-spacing:.14em;white-space:nowrap;-webkit-text-stroke:1.5px #2a1450;margin-bottom:.1em;background:linear-gradient(180deg,#e6f6ff,#7fc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:.9em 0 1.4em;font-size:.95em;opacity:.9;text-shadow:0 2px 6px #000}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.06em;border-radius:1em;padding:.85em 1.5em;min-width:11em;
 background:linear-gradient(180deg,#5aa0ff,#2a62e6);box-shadow:0 .28em 0 #14308a,0 .5em .9em #0008,inset 0 .12em 0 #ffffff55;text-shadow:0 .08em 0 #0a1f66;transition:transform .08s}
.btn:active{transform:translateY(.2em);box-shadow:0 .08em 0 #14308a,0 .2em .5em #0008,inset 0 .12em 0 #ffffff55}
.btn.go{background:linear-gradient(180deg,#7be85a,#2fae2a);box-shadow:0 .28em 0 #176a1a,0 .5em .9em #0008,inset 0 .12em 0 #ffffff66;text-shadow:0 .08em 0 #0d4a10;font-size:1.5em;padding:.7em 1.6em;animation:pulse 1.4s infinite}
.btn.go small{display:block;font-size:.5em;opacity:.9;letter-spacing:.14em}
.btn.gold{background:linear-gradient(180deg,#ffd84a,#f08a10);box-shadow:0 .28em 0 #9a5208,0 .5em .9em #0008,inset 0 .12em 0 #fff8;text-shadow:0 .08em 0 #8a4a05;color:#3a1c00}
.btn.red{background:linear-gradient(180deg,#ff7a6a,#d6322a);box-shadow:0 .28em 0 #7e1410,0 .5em .9em #0008,inset 0 .12em 0 #ffffff55;text-shadow:0 .08em 0 #5a0a08}
.btn.dark{background:linear-gradient(180deg,#4a5a86,#2a3560);box-shadow:0 .28em 0 #121a38,0 .5em .9em #0008,inset 0 .12em 0 #ffffff33;text-shadow:none;font-size:.9em;min-width:0}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.row{display:flex;gap:.8em;margin-top:1.1em;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.4em;background:linear-gradient(180deg,#1a2650,#0c1432);border:.12em solid #3a5ab0;border-radius:2em;padding:.25em .8em .25em .35em;font-weight:900;font-size:1em;box-shadow:0 .15em .4em #0008}
.coin{display:inline-block;width:1.25em;height:1.25em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc61a 55%,#c27a00);border:.1em solid #8a5200;box-shadow:inset 0 0 0 .15em #ffe15a66}
h2{font-family:'Arial Black',Impact,sans-serif;margin:.1em 0 .4em;font-size:1.9em;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 .08em 0 #0006,0 0 .6em #000a}
.panel{width:100%;max-width:21em;background:linear-gradient(180deg,#16224ccc,#0b1330ee);border:.12em solid #3a5ab0;border-radius:1.1em;padding:.9em;box-shadow:0 .5em 1.2em #000a}
.banner{font-family:'Arial Black',Impact,sans-serif;font-size:2.3em;font-weight:900;text-transform:uppercase;padding:.2em .7em;border-radius:.3em;margin-bottom:.4em;
 background:linear-gradient(180deg,#ffe36a,#f59a14);color:#3b1a00;border:.1em solid #fff4b0;text-shadow:0 .06em 0 #fff8;box-shadow:0 .2em 0 #9a5208,0 .5em 1em #000a;animation:pop .5s}
.banner.bad{background:linear-gradient(180deg,#ff8a7a,#c8281f);color:#fff;border-color:#ffc0b8;text-shadow:0 .06em 0 #5a0a08;box-shadow:0 .2em 0 #6e100c,0 .5em 1em #000a}
.stars{font-size:3em;letter-spacing:.05em;display:flex;gap:.1em;justify-content:center;margin:.1em 0}
.star{width:1.1em;height:1.1em;background:#3b4668;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);filter:drop-shadow(0 .05em 0 #0008)}
.star.on{background:linear-gradient(180deg,#fff6a0,#ffbf1a);animation:pop .5s both}
.line{display:flex;justify-content:space-between;align-items:center;padding:.3em .2em;font-weight:700;border-bottom:.06em solid #ffffff18}
.line b{font-size:1.1em;color:#ffe15a}
.sub{opacity:.85;font-size:.9em;margin:.2em 0 .6em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;width:100%;max-width:22em;overflow-y:auto;max-height:62%;padding:.3em;touch-action:pan-y}
.card{position:relative;border-radius:.8em;padding:.5em .2em .45em;border:.12em solid #3a5ab0;background:linear-gradient(180deg,#1b2a5a,#0d1636);cursor:pointer;font-weight:900;min-height:5.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em}
.card .n{font-size:1.7em;font-family:'Arial Black',Impact,sans-serif}
.card .t{font-size:.62em;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.card.cur{border-color:#ffd84a;box-shadow:0 0 .9em #ffd84a88}
.card.lock{opacity:.45;filter:grayscale(.8);cursor:default}
.card.t1{background:linear-gradient(180deg,#34406a,#161f40)}.card.t2{background:linear-gradient(180deg,#1f5f86,#0c2a4a)}.card.t3{background:linear-gradient(180deg,#8a2c14,#3a0e08)}
.up{display:flex;align-items:center;gap:.7em;padding:.6em;margin:.45em 0;border-radius:.8em;background:#0a1230;border:.1em solid #2c447f;text-align:left}
.up .ic{width:2.6em;height:2.6em;border-radius:.6em;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1em;background:linear-gradient(180deg,#5aa0ff,#2a62e6);box-shadow:inset 0 .1em 0 #fff6}
.up .tx{flex:1;min-width:0}.up .nm{font-weight:900;text-transform:uppercase;font-size:.9em;letter-spacing:.04em}
.up .ds{font-size:.72em;opacity:.8}.bar{height:.5em;border-radius:.3em;background:#18234a;margin-top:.3em;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd84a,#ff9a1a)}
.up .btn{min-width:5.2em;padding:.5em .6em;font-size:.85em}
#hudbtns{position:absolute;right:.6em;top:.6em;display:none;gap:.4em;z-index:5}
#hudbtns.on{display:flex}
.ib{width:2.5em;height:2.5em;border-radius:.7em;border:.1em solid #ffffff55;background:#0b1230bb;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#fff}
.ib svg{width:1.3em;height:1.3em;fill:currentColor}
#tbtns{position:absolute;right:.6em;top:.6em;z-index:6}
#hint{position:absolute;left:0;right:0;bottom:3%;display:none;flex-direction:column;align-items:center;pointer-events:none;font-weight:900;text-shadow:0 2px 6px #000;letter-spacing:.1em;text-transform:uppercase;font-size:.95em;z-index:4}
#hint.on{display:flex}
#hint .fg{margin-top:.5em;width:3.2em;height:3.2em;border-radius:50%;background:radial-gradient(circle,#fff,#fff8 60%,#fff0 70%);animation:drag 1.6s ease-in-out infinite}
.cd{margin-top:.8em;font-size:.85em;opacity:.85}
.mutedx{display:none}.muted .mutedx{display:inline}.muted .soundon{display:none}
</style></head><body>
<div id="app">
<canvas id="c"></canvas>
<div id="hint"><div>Drag to steer</div><div class="fg"></div></div>
<div id="hudbtns"><button class="ib" id="btnPause" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button><button class="ib btnMute" aria-label="mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="soundon" d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="mutedx" d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button></div>

<div class="scr" id="sTitle">
 <div style="position:absolute;right:.6em;top:.6em"><button class="ib btnMute" aria-label="mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="soundon" d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="mutedx" d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button></div>
 <div style="position:absolute;left:.7em;top:.7em" class="pill"><span class="coin"></span><span id="tCoins">0</span></div>
 <div style="margin-top:-28%"><div class="logo"><small>Crowd of Steel</small>Lord's<br>Rush</div><div class="tag">Gather the horde. Crush the boss.</div></div>
 <div style="position:absolute;bottom:9%;left:0;right:0;display:flex;flex-direction:column;align-items:center">
 <button class="btn go" id="bPlay">Play<small id="tRound">Round 1</small></button>
 <div class="row"><button class="btn dark" id="bRounds">Rounds</button><button class="btn gold" id="bShop" style="font-size:.9em;min-width:0">Upgrades</button></div>
 <div class="sub" style="margin-top:1em" id="tBest"></div></div>
</div>

<div class="scr dim" id="sRounds"><h2>Select Round</h2><div class="sub" id="rSub"></div><div class="grid" id="rGrid"></div><div class="row"><button class="btn dark" id="rBack">Back</button></div></div>

<div class="scr dim" id="sShop"><div class="pill" style="margin-bottom:.6em"><span class="coin"></span><span id="shCoins">0</span></div><h2>Upgrades</h2>
 <div class="panel" id="shList"></div><div class="row"><button class="btn go" id="shGo" style="font-size:1.1em"></button></div></div>

<div class="scr dim" id="sWin"><div class="banner">Round <span id="wR">1</span><br>Complete!</div><div class="stars" id="wStars"></div>
 <div class="panel"><div class="line"><span>Coins collected</span><b id="wC1">0</b></div><div class="line"><span>Boss bonus</span><b id="wC2">0</b></div><div class="line"><span>Income x<span id="wMul">1</span></span><b id="wC3">+0</b></div><div class="line" style="border:0;font-size:1.15em"><span>Total</span><b id="wTot" style="font-size:1.4em">0</b></div></div>
 <div class="row" style="flex-direction:column;align-items:center"><button class="btn go" id="wNext" style="font-size:1.2em">Next Round<small id="wNr"></small></button><div class="cd" id="wCd"></div><button class="btn gold" id="wShop" style="font-size:.85em;min-width:0">Upgrades</button></div></div>

<div class="scr dim" id="sLose"><div class="banner bad">Defeated</div><div class="sub" id="lWhy" style="font-size:1.05em">The horde was crushed.</div>
 <div class="panel"><div class="line"><span>Round</span><b id="lR">1</b></div><div class="line"><span>Track progress</span><b id="lP">0%</b></div><div class="line"><span>Coins kept</span><b id="lC">0</b></div></div>
 <div class="row" style="flex-direction:column;align-items:center"><button class="btn go" id="lRetry" style="font-size:1.2em">Retry</button><div class="row" style="margin-top:.7em"><button class="btn gold" id="lShop" style="font-size:.85em;min-width:0">Upgrades</button><button class="btn dark" id="lMenu">Menu</button></div></div></div>

<div class="scr dim" id="sPause"><h2>Paused</h2><div class="row" style="flex-direction:column;align-items:center;gap:1em"><button class="btn go" id="pRes" style="font-size:1.2em">Resume</button><button class="btn" id="pRestart">Restart round</button><button class="btn dark" id="pMenu">Menu</button></div></div>
</div>
<script>
/* ===== src/10_core.js ===== */
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SAVE_KEY='lordsrush_save_v1';
function loadSave(){let d={};try{d=JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch(e){}
 return Object.assign({coins:0,power:0,start:0,income:0,round:1,best:1,muted:false,wins:0,losses:0,bestCrowd:0,stars:{}},d);}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
// ---- upgrades ----
const UPG={
 power:{name:'Unit Power',ds:l=>'Damage +'+Math.round(l*12)+'%  (next +12%)',cost:l=>Math.round(30*Math.pow(1.34,l)),ic:'PWR'},
 start:{name:'Starting Crowd',ds:l=>'Start with '+startCount(l)+' knights',cost:l=>Math.round(25*Math.pow(1.38,l)),ic:'+N'},
 income:{name:'Income',ds:l=>'Coins x'+(1+0.15*l).toFixed(2),cost:l=>Math.round(40*Math.pow(1.42,l)),ic:'$$'},
};
const MAXUP=30;
function startCount(l){return 6+2*(l===undefined?save.start:l);}
function powerMul(){return 1+0.12*save.power;}
function incomeMul(){return 1+0.15*save.income;}
function unitType(){const p=save.power;return p<3?0:p<7?1:p<12?2:3;}
const UNIT_NAMES=['Squire','Knight','Paladin','Archon'];
// ---- themes ----
const THEMES=[
 {id:'castle',name:'Royal Keep',sky:['#26356e','#7a5a9a','#f0a07a'],ground:[58,64,86],fog:[196,150,160],floorA:[206,209,218],floorB:[184,189,202],carpet:[176,30,44],carpetEdge:[240,200,90],
  wallL:[120,126,146],wallR:[46,104,214],wallTop:[170,176,196],glow:'#ffb050',snow:false,ember:false},
 {id:'ice',name:'Frostbound Pass',sky:['#0e3a66','#3a86b8','#bfe8ff'],ground:[150,190,220],fog:[190,226,246],floorA:[226,240,252],floorB:[198,222,242],carpet:[40,150,210],carpetEdge:[220,248,255],
  wallL:[110,170,214],wallR:[70,150,230],wallTop:[220,244,255],glow:'#9fe8ff',snow:true,ember:false},
 {id:'lava',name:'Ember Citadel',sky:['#1a0608','#7a1a10','#ff7a2a'],ground:[70,20,10],fog:[210,90,40],floorA:[92,76,80],floorB:[74,60,66],carpet:[255,110,20],carpetEdge:[255,210,90],
  wallL:[70,50,56],wallR:[120,44,28],wallTop:[150,110,96],glow:'#ff8a30',snow:false,ember:true},
];
const BOSS_BY_THEME=[['knight','ogre','bone'],['golem','knight','bone'],['demon','ogre','golem']];
const BOSS_NAMES={knight:'Iron Colossus',ogre:'Ogre Warlord',bone:'Bone King',golem:'Frost Golem',demon:'Magma Demon'};
const FOE_NAMES=['Iron Raiders','Frost Reavers','Magma Horde'];

/* ===== src/11_audio.js ===== */
const AU={ctx:null,master:null,last:{},noiseBuf:null,boss:false,step:0,next:0,timer:0};
function auInit(){
 if(AU.ctx)return;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();
  AU.master=AU.ctx.createGain();AU.master.gain.value=save.muted?0:0.8;
  const comp=AU.ctx.createDynamicsCompressor();AU.master.connect(comp);comp.connect(AU.ctx.destination);
  AU.sfxG=AU.ctx.createGain();AU.sfxG.gain.value=1;AU.sfxG.connect(AU.master);
  AU.musG=AU.ctx.createGain();AU.musG.gain.value=0.5;AU.musG.connect(AU.master);
  const n=AU.ctx.sampleRate*1.0,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noiseBuf=b;
  AU.next=AU.ctx.currentTime+0.1;AU.timer=setInterval(musicTick,90);
 }catch(e){AU.ctx=null;}
}
function auResume(){if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{});}
function setMuted(m){save.muted=m;persist();if(AU.master)AU.master.gain.setTargetAtTime(m?0:0.8,AU.ctx.currentTime,0.03);
 document.getElementById('app').classList.toggle('muted',m);}
function tone(f,d,type,v,slide,delay,dest){
 const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(dest||AU.sfxG);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,lp,hp,delay,dest){
 const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0);const s=c.createBufferSource();s.buffer=AU.noiseBuf;
 const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||6000;const h=c.createBiquadFilter();h.type='highpass';h.frequency.value=hp||0;
 const g=c.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 s.connect(f);f.connect(h);h.connect(g);g.connect(dest||AU.sfxG);s.start(t,Math.random()*0.5);s.stop(t+d+0.02);
}
let coinPitch=0,coinT=0;
const SFX={
 click(){tone(660,0.07,'triangle',0.2,1.5);},
 gate(){[523,659,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.09,1,i*0.05));},
 bad(){tone(220,0.35,'sawtooth',0.14,0.45);tone(165,0.35,'square',0.08,0.5,0.04);},
 mult(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,'square',0.08,1,i*0.045));tone(196,0.4,'triangle',0.2,1,0);},
 coin(){const n=performance.now();if(n-coinT>450)coinPitch=0;coinT=n;coinPitch=Math.min(coinPitch+1,10);const f=880*Math.pow(1.0595,coinPitch);tone(f,0.09,'square',0.08,1);tone(f*1.5,0.14,'square',0.07,1,0.05);},
 recruit(){tone(500,0.1,'triangle',0.16,2);tone(750,0.14,'triangle',0.14,1.5,0.05);},
 hit(){noise(0.12,0.2,2500,300);tone(120,0.12,'square',0.1,0.5);},
 shoot(){tone(1400,0.07,'triangle',0.035,0.4);},
 foe(){noise(0.1,0.14,3000,500);},
 boom(){noise(0.5,0.45,1400,0);tone(80,0.5,'sine',0.4,0.3);},
 bossHit(){tone(95,0.12,'square',0.12,0.6);noise(0.06,0.1,1800,200);},
 telegraph(){tone(300,0.15,'sawtooth',0.07,1.3);tone(300,0.15,'sawtooth',0.07,1.3,0.22);},
 slam(){noise(0.7,0.55,900,0);tone(55,0.7,'sine',0.55,0.4);tone(110,0.3,'square',0.12,0.4);},
 ice(){for(let i=0;i<8;i++)tone(1800+Math.random()*2200,0.35,'triangle',0.05,0.6,i*0.03);noise(0.7,0.25,9000,3000);tone(300,0.6,'sawtooth',0.08,3);},
 speed(){tone(300,0.45,'sawtooth',0.1,4);tone(450,0.45,'square',0.06,4,0.05);},
 roar(){tone(90,1.1,'sawtooth',0.28,0.5);tone(70,1.1,'square',0.2,0.6,0.05);noise(0.9,0.2,700,0);},
 horn(){tone(262,0.5,'sawtooth',0.12,1);tone(392,0.5,'sawtooth',0.1,1,0.0);tone(330,0.6,'triangle',0.15,1,0.18);},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>{tone(f,0.28,'square',0.1,1,i*0.11);tone(f/2,0.28,'triangle',0.14,1,i*0.11);});},

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lg(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>gr.addColorStop(i/(st.length-1),s));return gr;}
function rg(g,x,y,r0,r1,st){const gr=g.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>gr.addColorStop(i/(st.length-1),s));return gr;}
function poly(g,pts){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();}

// ================= procedural levels =================
const TW=1.6; // track half width
function applyOp(n,op,v){return op==='+'?n+v:op==='x'?Math.floor(n*v):op==='-'?Math.max(0,n-v):Math.ceil(n/v);}
function gateLabel(op,v){return (op==='x'?'x':op==='/'?'\u00f7':op)+v;}
function niceNum(v){if(v>40)return Math.round(v/10)*10;if(v>14)return Math.round(v/5)*5;return Math.max(2,Math.round(v));}
function genLevel(r){
 const rnd=mulberry(r*7919+101),R=()=>rnd();
 const d=r-1,theme=(r-1)%3;
 const L=Math.round(Math.min(560,150+20*r));
 const ents=[];let est=6;
 const bossType=BOSS_BY_THEME[theme][Math.floor((r-1)/3)%3];
 const foeKind=theme;
 let gid=0;
 const estCap=90+32*d;
 function gatePair(z,final){
  const id=++gid;
  const addv=()=>({op:'+',v:niceNum(Math.min(est,estCap)*(0.1+R()*0.2)+2+R()*3)});
  const mulv=()=>({op:'x',v:R()<0.72?2:(R()<0.85||d<4?3:4)});
  const good=()=>(est>estCap||R()<(final?0.4:0.5))?addv():mulv();
  const weak=()=>({op:'+',v:2+Math.floor(R()*4)});
  const bad=()=>{if(d>=3&&R()<0.3)return{op:'/',v:2};return{op:'-',v:niceNum(Math.min(est,estCap*1.5)*(0.08+R()*0.2+Math.min(0.12,d*0.008))+1)};};
  let A=good(),B;
  const pb=final?0:Math.min(0.72,0.28+0.04*d);
  B=R()<pb?bad():(R()<0.5?weak():good());
  if(final){B=good();}
  if(R()<0.5){const t=A;A=B;B=t;}
  [[A,-TW,0],[B,0,TW]].forEach(([o,x0,x1])=>ents.push({t:'gate',id,z,x0,x1,op:o.op,v:o.v,taken:false,flash:0}));
  const best=Math.max(applyOp(est,A.op,A.v),applyOp(est,B.op,B.v));
  est=Math.min(3000,Math.max(3,best));
 }
 function lanes(n,minGap){const out=[];const slots=[-1.2,-0.4,0.4,1.2];const idx=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(R()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  for(let i=0;i<n&&i<idx.length;i++)out.push(slots[idx[i]]+(R()-.5)*.25);return out;}
 function obstacleRow(z){
  const n=Math.min(2,1+Math.floor(R()*(1+d/4)));
  lanes(n).forEach(x=>{const kr=R(),k=kr<0.38?'spike':kr<0.68?'barrel':'saw';
   if(k==='spike')ents.push({t:'obs',k,z,x,w:0.8+R()*0.15,dead:false});
   else if(k==='barrel')ents.push({t:'obs',k,z,x,w:0.5,hp:10+d*4,dead:false});
   else ents.push({t:'obs',k,z,x,w:0.62,amp:0.3+R()*0.25,sp:1.6+R()*1.2+d*0.05,ph:R()*6,dead:false});});
  est=Math.max(3,est*(1-0.03-0.01*Math.min(8,d)));
 }
 function recruits(z){
  const n=1+Math.floor(R()*3);let tot=0;
  lanes(n).forEach((x,i)=>{const c=2+Math.floor(R()*3)+Math.floor(d/2);tot+=c;ents.push({t:'rec',z:z+i*1.4,x,n:c,taken:false});});
  est+=tot*0.9;
 }
 function coinLine(z){
  const n=7+Math.floor(R()*4),x0=(R()-.5)*2,x1=(R()-.5)*2,amp=R()<.5?0:0.5;
  for(let i=0;i<n;i++){const f=i/(n-1);ents.push({t:'coin',z:z+i*1.15,x:clamp(lerp(x0,x1,f)+Math.sin(f*6.28)*amp,-1.3,1.3),taken:false,ph:R()*6});}
 }
 function bonusWall(z){
  const side=R()<0.6?1:-1,n=6+Math.floor(R()*4),v=d<5?2:d<10?3:5;
  for(let i=0;i<n;i++)ents.push({t:'blk',z:z+i*1.15,x:side*1.28,v,taken:false,flash:0});
  est+=n*v*0.6;
 }
 function foeGroup(z){
  // enemy armies are a core part of EVERY round: guaranteed placement, sized from the estimated crowd
  const frac=0.36+0.01*Math.min(d,24);
  const fd=0.45+0.02*Math.min(r,30);            // enemy damage per soldier per second in melee
  const n=Math.min(Math.max(10+Math.min(r,8),Math.round(est*frac*(0.85+R()*0.3))),Math.max(9,Math.round(est*0.8)));
  const sx=(R()-.5)*1.0;
  ents.push({t:'sign',z:z-10,x:R()<.5?-1.5:1.5,n});
  ents.push({t:'foe',z,z0:z,x:sx,n,n0:n,st:'idle',freeze:0,units:[],dead:false,kind:foeKind,acc:0,dmgAcc:0,dmgT:0,fd,gs:r===1?1.7:2.2,giant:{ph:Math.random()*8,x:sx,z:z+0.9},fightT:0,flash:0,warned:false});
  est=Math.max(3,est-n*(fd*1.25-0.5));
 }
 const nFoe=Math.min(4,1+Math.floor(r/3));
 const foeZs=[];for(let k=0;k<nFoe;k++)foeZs.push(Math.round(54+k*(L-48-54)/nFoe));
 let nextFoe=0;
 let z=26,first=true,lastFoe=-99,lastWall=-99,lastGate=0;
 const gap=()=>Math.max(8.5,14-0.35*Math.min(d,14))+R()*4;
 while(z<L-34){
  let kind;
  if(first){kind='gate';first=false;}
  else if(nextFoe<foeZs.length&&z>=foeZs[nextFoe])kind='foe';
  else if(z-lastGate>30)kind='gate';
  else{
   const w=R();
   if(w<0.52)kind='gate';
   else if(w<0.52+0.16+0.012*d)kind='obs';
   else if(w<0.75+0.01*d)kind='rec';
   else if(w<0.88&&z-lastWall>50)kind='wall';
   else if(w<0.94)kind='speed';
   else kind='coin';
  }
  if(kind==='gate'){gatePair(z);lastGate=z;}
  else if(kind==='obs'){obstacleRow(z);if(d>=6&&R()<0.4)obstacleRow(z+5);}
  else if(kind==='rec')recruits(z);
  else if(kind==='wall'){bonusWall(z);lastWall=z;z+=6;}
  else if(kind==='speed'){ents.push({t:'pow',k:'speed',z,x:(R()-.5)*1.6,taken:false});}
  else if(kind==='foe'){
   foeGroup(z+4);lastFoe=z;nextFoe++;z+=6;}
  else coinLine(z);
  // coins sprinkled
  if(R()<0.55&&kind!=='coin'&&kind!=='wall')coinLine(z+gap()*0.5-2);
  z+=gap();
 }
 // final: ice power + big gate pair before boss
 ents.push({t:'pow',k:'ice',z:L-40,x:(R()-.5)*1.0,taken:false});
 coinLine(L-34);
 gatePair(L-26,true);
 const dps1=1.6;
 const T=7+0.45*d;
 const hp=Math.round((()=>{const f=1400*Math.pow(1.2,d);return f*clamp(est*dps1*T*(1+0.04*d)/f,1,1.6);})());
 ents.sort((a,b)=>a.z-b.z);
 const boss={type:bossType,name:BOSS_NAMES[bossType],hp,scale:Math.min(1.9,1+0.055*d),
  atkInt:Math.max(1.35,2.9-0.09*d),dmgP:Math.min(0.75,0.38+0.025*d),zoneHW:Math.min(1.0,0.72+0.02*d),tele:Math.max(0.75,1.2-0.02*d)};
 return {round:r,L,theme,ents,boss,est,foeKind,name:THEMES[theme].name};
}

function P(x,y,z,vx,vy,vz,life,col,size,grav,kind){
 if(G.fx.length>650)return;G.fx.push({x,y,z,vx,vy,vz,life,max:life,col,size,grav:grav===undefined?9:grav,kind:kind||0,rot:Math.random()*6,vr:(Math.random()-.5)*10});
}
function burst(x,y,z,n,col,spd,size,life,grav){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(0.3+Math.random()*0.7);P(x,y,z,Math.cos(a)*s,Math.random()*spd*0.9,Math.sin(a)*s,life*(0.6+Math.random()*0.6),col,size*(0.6+Math.random()*0.8),grav);}}
function FL(x,y,z,text,col,size,life){G.floats.push({x,y,z,text:String(text),col:col||'#fff',size:size||1,life:life||1,max:life||1,vy:1.6});}
function shake(a){G.shake=Math.max(G.shake,a);}

// ---------- round setup ----------
function startRound(r,opts){
 opts=opts||{};
 G.round=r;G.demo=!!opts.demo;G.lvl=genLevel(r);
 G.t=0;G.introT=0;G.z=0;G.x=0;G.tx=0;G.cam.x=0;G.cam.z=-5.5;G.units=[];G.fx.length=0;G.floats.length=0;G.projs.length=0;G.rings.length=0;
 G.count=G.demo?14:startCount();G.peak=G.count;G.coinsRun=0;G.kills=0;G.boost=0;G.shake=0;G.flash=0;G.slow=1;G.lossAcc=0;G.hurt=0;G.endT=0;G.paused=false;
 G.melee=null;G.foeWarn=0;G.lossAcc2=0;G.tele=0;G.bossIntro=0;G.gateBanner=null;G.coinCombo=0;G.runT=0;G.tgt=null;
 const b=G.lvl.boss;
 G.boss={type:b.type,name:b.name,hp:b.hp,max:b.hp,scale:b.scale,z:G.lvl.L+6,x:0,t:0,flash:0,bump:0,dead:false,frozen:0,active:false,roared:false,fightT:0,enr:0,dmgAcc:0,dmgT:0,deadT:0,
  atk:{st:0,timer:2.4,type:'',zones:[],dur:1,t:0},cfg:b,stopZ:G.lvl.L-1.5};
 G.phase=G.demo?'run':'intro';
 for(let i=0;i<G.count&&i<MAXV;i++)G.units.push(newUnit(G.x+(Math.random()-.5)*.5,G.z+(Math.random()-.5)*.5,1));
 setTheme(G.lvl.theme);
 if(!G.demo){sfx('horn',0);AU.boss=false;}
}
function newUnit(x,z,sc){return{x,z,ph:Math.random()*8,sc:sc===undefined?0.3:sc,hop:0,hv:0,fl:0};}
// ---------- crowd helpers ----------
function addCrowd(n,sx,sz){
 G.count=Math.min(99999,G.count+n);if(G.count>G.peak)G.peak=G.count;
 if(G.count>save.bestCrowd){save.bestCrowd=G.count;}
 const room=Math.min(MAXV,G.count)-G.units.length;
 for(let i=0;i<room;i++)G.units.push(newUnit(sx+(Math.random()-.5)*.7,sz+(Math.random()-.5)*.7,0.25));
}
function killSprite(i,fling){
 const u=G.units[i];
 if(fling&&G.fx.length<500)P(u.x,0.3,u.z,(Math.random()-.5)*3,4+Math.random()*3,2+Math.random()*3,0.7,'#9cc6ff',1,10,1);
 const last=G.units.pop();if(i<G.units.length)G.units[i]=last;
}
function loseCount(n,px,pz,fling){
 n=Math.min(n,G.count);if(n<=0)return;
 G.count-=n;G.hurt=0.25;
 let target=Math.min(G.count,MAXV);
 // remove sprites nearest the hit point
 while(G.units.length>target){
  let bi=0,bd=1e9;const m=G.units.length;
  for(let s=0;s<5;s++){const i=(Math.random()*m)|0,u=G.units[i],d=Math.abs(u.x-px)*1.2+Math.abs(u.z-pz);if(d<bd){bd=d;bi=i;}}
  killSprite(bi,fling);
 }
}

 e.taken=true;e.flash=1;

 if(good){addCrowd(nc-old,px,pz+0.3);sfx(e.op==='x'?'mult':'gate',0);burst(px,0.6,pz,24,'#8fd0ff',5,1.2,0.7,2);flash('80,170,255',0.22);
  FL(px,1.7,pz+0.5,label,'#7fd0ff',1.9,1.1);}
 else{loseCount(old-nc,px,pz,true);sfx('bad',0);burst(px,0.6,pz,24,'#ff6a5a',5,1.2,0.7,2);flash('255,60,50',0.25);shake(6);
  FL(px,1.7,pz+0.5,label,'#ff6a5a',1.9,1.1);}
 G.gateBanner={t:0,text:label,good};
}
function powerUp(e){
 e.taken=true;
 if(e.k==='speed'){G.boost=4.5;sfx('speed',0);flash('255,200,60',0.2);FL(G.x,1.8,G.z+0.5,'SPEED!','#ffd24a',1.6,1.1);burst(G.x,0.5,G.z,20,'#ffd24a',6,1.2,0.6,0);}
 else{iceBlast();FL(G.x,1.8,G.z+0.5,'ICE BLAST!','#9fe8ff',1.6,1.2);}

function iceBlast(){
 sfx('ice',0);flash('180,240,255',0.55);shake(8);
 G.rings.push({x:G.x,z:G.z,r:0.5,max:26,life:0.9,t:0,col:'160,235,255'});G.rings.push({x:G.x,z:G.z,r:0.2,max:18,life:0.7,t:0,col:'255,255,255'});
 burst(G.x,0.8,G.z+1,70,'#cfeeff',9,1.6,1.0,3);
 for(const e of G.lvl.ents){
  if(e.t==='foe'&&!e.dead&&e.z-G.z<28&&e.z-G.z>-3){e.freeze=2.5;const dmg=Math.ceil(e.n*0.2);e.n-=dmg;FL(e.x,2.6,e.z,'-'+dmg,'#9fe8ff',1.5,1);burst(e.x,0.8,e.z,22,'#cfeeff',5,1.2,0.8,2);if(e.n<=0)killFoe(e);}
  if(e.t==='obs'&&e.k==='barrel'&&!e.dead&&e.z-G.z<20&&e.z-G.z>0)explodeBarrel(e,false);
 }
 const b=G.boss;if(G.phase==='boss'&&!b.dead){const d=Math.round(b.max*0.06);b.hp-=d;b.frozen=2.5;b.flash=1;FL(b.x,4.2*b.scale,b.z,d,'#9fe8ff',2.6,1.2);burst(b.x,2.5,b.z-1,40,'#cfeeff',8,1.8,1,3);}
}
function explodeBarrel(e,hurt){
 e.dead=true;sfx('boom',0.05);shake(hurt?8:4);
 const ex=e.cx!==undefined?e.cx:e.x;
 burst(ex,0.5,e.z,34,'#ffb030',7,1.6,0.7,4);burst(ex,0.6,e.z,18,'#ff4a20',5,2,0.6,2);burst(ex,0.8,e.z,12,'#444',3,2,1.0,-1);
 if(hurt){let cap=3+Math.floor(G.round/2),n=0;for(let i=G.units.length-1;i>=0&&n<cap;i--){const u=G.units[i];if(Math.hypot(u.x-ex,(u.z-e.z)*0.7)<0.95){const k=Math.max(1,Math.round(G.count/G.units.length));killSprite(i,true);G.count-=k;n++;}}
  if(n){G.hurt=0.25;FL(ex,1.6,e.z,'-'+n,'#ff6a5a',1.4,0.9);}}
}
function insertEnt(c){const a=G.lvl.ents;let i=a.length;while(i>0&&a[i-1].z>c.z)i--;a.splice(i,0,c);}
function killFoe(e){
 e.dead=true;G.kills++;sfx('foe',0.05);shake(6);flash('255,230,170',0.25);G.melee=null;
 for(const u of e.units)P(u.x,0.4,u.z,(Math.random()-.5)*5,3+Math.random()*4,(Math.random()-.5)*4,0.9,['#ff3a2a','#fff','#ffb04a','#2a1030'][Math.random()*4|0],1.4,9);
 burst(e.x,0.7,e.z,40,'#ffffff',7,1.4,0.7,2);burst(e.x,1.1,e.z+0.5,30,'#ff5a3a',8,1.8,0.9,4);
 G.rings.push({x:e.x,z:e.z,r:0.3,max:4,life:0.6,t:0,col:'255,200,120'});
 FL(e.x,2.4,e.z,'ARMY DOWN!','#ffd24a',1.5,1.3);
 e.units.length=0;e.giant=null;
 const rw=Math.max(2,Math.round(e.n0*0.5));addCrowd(rw,G.x,G.z+1);FL(G.x,1.9,G.z+1.2,'+'+rw+' SPOILS','#7fd0ff',1.4,1.3);
 if(G.fx.length<600)for(let i=0;i<4;i++){const cx=e.x+(Math.random()-.5);insertEnt({t:'coin',z:e.z+Math.random()*2,x:clamp(cx,-1.3,1.3),taken:false,ph:0,drop:1});}
}
// ---------- steering helpers ----------
function setSteer(v){G.tx=clamp(v,-TW,TW);}
// ---------- main update ----------
function update(dt){
 G.t+=dt;
 G.shake*=Math.pow(0.002,dt);if(G.shake<0.05)G.shake=0;
 G.foeWarn=Math.max(0,G.foeWarn-dt);G.flash=Math.max(0,G.flash-dt*2.2);G.hurt=Math.max(0,G.hurt-dt);
 if(G.gateBanner){G.gateBanner.t+=dt;if(G.gateBanner.t>1)G.gateBanner=null;}
 updateFx(dt);
 if(G.paused)return;
 const ph=G.phase;
 if(ph==='intro'){G.introT+=dt;steerUpdate(dt);updateUnits(dt,false);if(G.introT>=1.9){G.phase='run';}return;}
 if(ph==='run'||ph==='boss'){play(dt);return;}
 if(ph==='bossdie'){bossDie(dt);return;}
 if(ph==='win'){updateUnits(dt,false,true);return;}
 if(ph==='lose'){for(const u of G.units)u.ph+=dt*2;return;}
 updateUnits(dt,false);
}
function steerUpdate(dt){
 if(G.auto||G.demo)G.tx=botTarget();
 const lim=limX();const t=clamp(G.tx,-lim,lim);
 G.x+=(t-G.x)*Math.min(1,dt*12);
}
function play(dt){
 const L=G.lvl.L,b=G.boss;
 G.runT+=dt;
 steerUpdate(dt);
 // ----- speed -----
 let sp=baseSpeed();
 if(G.boost>0){G.boost-=dt;sp*=1.6;}
 G.slow=1;
 for(const e of G.lvl.ents){
  if(e.t!=='foe'||e.dead)continue;const dz=e.z-G.z;
  if(e.st==='fight')G.slow=0;
  else if(dz<14&&dz>-2){G.slow=Math.min(G.slow,0.6);}
 }
 sp*=G.slow;
 if(G.phase==='run'&&G.z>=L-16){G.phase='boss';b.active=true;G.bossIntro=0;if(!G.demo){sfx('roar',0);AU.boss=true;shake(8);}}
 if(G.phase==='boss'){G.bossIntro+=dt;sp=Math.min(sp,Math.max(0.9,(b.stopZ-G.z)*1.2));}
 G.z=Math.min(G.z+sp*dt,G.phase==='boss'?b.stopZ:1e9);
 G.speedNow=sp;
 // ----- entities -----
 const px=G.x,pz=G.z,R=crowdR(G.units.length);
 const near=[];
 for(const e of G.lvl.ents){
  const dz=e.z-pz;if(dz>40)break;
  if(e.t==='obs'&&e.k==='saw'){e.cx=e.x+Math.sin(G.t*e.sp+e.ph)*e.amp;}
  if(dz<-6)continue;
  switch(e.t){
   case 'gate':if(!e.taken&&pz>=e.z-0.05&&px>=e.x0&&px<=e.x1){for(const o of G.lvl.ents)if(o.t==='gate'&&o.id===e.id)o.taken=true;applyGate(e);}break;
   case 'rec':if(!e.taken&&Math.abs(dz)<0.8&&Math.abs(px-e.x)<R*0.8+0.5){e.taken=true;addCrowd(e.n,e.x,e.z);sfx('recruit',0.05);FL(e.x,1.4,e.z,'+'+e.n,'#9fe8ff',1.2,0.9);burst(e.x,0.5,e.z,10,'#9fe8ff',3,1,0.5,2);}break;
   case 'coin':if(!e.taken&&Math.abs(dz)<0.9&&Math.abs(px-e.x)<R*0.8+(G.boost>0?1.4:0.45)){e.taken=true;G.coinsRun++;sfx('coin',0.03);burst(e.x,0.6,e.z,4,'#ffd84a',3,0.9,0.4,2);G.coinFlash=0.15;}break;
   case 'pow':if(!e.taken&&Math.abs(dz)<1&&Math.abs(px-e.x)<R*0.8+0.6)powerUp(e);break;
   case 'obs':case 'blk':if(!e.dead&&!e.taken&&Math.abs(dz)<3)near.push(e);break;
  }
 }
 // ----- units follow & collide -----
 updateUnits(dt,true,false,near);
 // ----- foes -----
 updateFoes(dt);
 // ----- shooting -----
 shootUpdate(dt);
 // ----- boss -----
 if(G.phase==='boss')bossUpdate(dt);
 // peak
 if(G.count>G.peak)G.peak=G.count;
 // ----- end -----
 if(G.count<=0&&G.units.length===0){
  if(G.demo){startRound(1+(G.round%6),{demo:true});return;}
  G.phase='lose';G.endT=0;save.losses++;persist();sfx('lose',0);AU.boss=false;
  setTimeout(()=>{if(G.phase==='lose')showLose();},900);
 }
 if(G.demo&&G.z>L-30){startRound(1+(G.round%6),{demo:true});}
 if(G.phase==='boss'&&b.hp<=0&&!b.dead){b.dead=true;G.phase='bossdie';b.deadT=0;sfx('boom',0);shake(14);flash('255,240,200',0.8);}
}
// ---------- units ----------
function updateUnits(dt,moving,cheer,near){
 const m=G.units.length,c=Math.min(0.15,1.05/Math.sqrt(Math.max(1,m)));
 const k=1-Math.exp(-dt*9);
 const anim=G.melee?11:moving?(G.speedNow*0.55+4):(cheer?9:2);
 let killedFrame=0;
 for(let i=0;i<m;i++){
  const u=G.units[i];
  const r=c*Math.sqrt(i+0.5),a=i*2.39996;
  let tx=G.x+Math.cos(a)*r,tz=G.z+Math.sin(a)*r*1.5;
  if(G.melee){ // melee: the front of the crowd surges into the enemy line and recoils
   const fw=clamp((Math.sin(a)*r*1.5+0.1)/Math.max(0.4,1.5*crowdR(m)),0,1);
   const lun=0.2+0.55*fw*(0.5+0.5*Math.sin(G.t*13+i*1.7));
   tz+=lun;tx+=Math.sin(G.t*17+i*2.3)*0.05;}
  u.x+=(tx-u.x)*k;u.z+=(tz-u.z)*k;u.ph+=dt*anim;
  if(u.sc<1)u.sc=Math.min(1,u.sc+dt*4);
  if(cheer){if(u.hop<=0&&Math.random()<dt*1.5){u.hv=4+Math.random()*2;}}
  if(u.hv!==0||u.hop>0){u.hv-=14*dt;u.hop+=u.hv*dt;if(u.hop<=0){u.hop=0;u.hv=0;}}
 }
 if(near&&near.length&&G.units.length){
  for(let i=G.units.length-1;i>=0;i--){
   const u=G.units[i];if(!u)continue;
   for(const e of near){
    if(e.dead||e.taken)continue;
    const ex=e.t==='obs'&&e.k==='saw'?e.cx:e.x;
    if(e.t==='blk'){if(Math.abs(u.x-ex)<0.5&&Math.abs(u.z-e.z)<0.6){e.taken=true;e.flash=1;addCrowd(e.v,ex,e.z);sfx('recruit',0.04);FL(ex,1.5,e.z,'+'+e.v,'#7fd0ff',1.2,0.8);burst(ex,0.5,e.z,8,'#7fd0ff',3,1,0.5,2);}continue;}
    if(e.k==='barrel'){if(Math.abs(u.x-ex)<0.38&&Math.abs(u.z-e.z)<0.4){explodeBarrel(e,true);break;}continue;}
    if(Math.abs(u.x-ex)<e.w*0.5+0.04&&Math.abs(u.z-e.z)<0.38){
     const kk=Math.max(1,Math.round(G.count/G.units.length));
     killSprite(i,true);G.count=Math.max(0,G.count-kk);killedFrame+=kk;
     e.kills=(e.kills||0)+kk;if(e.kills>=(e.k==='saw'?8+1.5*G.round:6+1.2*G.round)){e.dead=true;sfx('boom',0.1);burst(ex,0.5,e.z,18,e.k==='saw'?'#ffd24a':'#ccc',5,1.4,0.6,3);}
     burst(u.x,0.3,u.z,3,e.k==='saw'?'#ffd24a':'#ff5a4a',4,0.9,0.4,6);
     break;
    }
   }
  }
  if(killedFrame){G.hurt=0.2;shake(3);sfx('hit',0.08);G.lossAcc+=killedFrame;if(G.lossAcc>=1&&G.t-(G.lastLossFl||0)>0.25){G.lastLossFl=G.t;FL(G.x,1.8,G.z+1,'-'+Math.round(G.lossAcc),'#ff6a5a',1.2,0.8);G.lossAcc=0;}}
 }
 // sync sprite count with count
 const tl=Math.min(G.count,MAXV);
 while(G.units.length>tl)G.units.pop();
 if(G.units.length<tl){const n=Math.min(tl-G.units.length,Math.ceil(dt*60));for(let i=0;i<n;i++)G.units.push(newUnit(G.x+(Math.random()-.5)*.6,G.z+(Math.random()-.5)*.6,0.3));}
}
// ---------- foes ----------
const FOE_MAXV=60;
function foeRad(m){return Math.min(0.2*Math.sqrt(Math.max(1,m)),0.95);}
function foeSlot(e,i,m){const c=Math.min(0.2,0.95/Math.sqrt(Math.max(1,m)));const r=c*Math.sqrt(i+0.5),a=i*2.39996;return[e.x+Math.cos(a)*r*1.25,e.z+Math.sin(a)*r*1.0+0.15];}
function contactZ(e,m){return G.z+1.2*crowdR(G.units.length)+foeRad(m)*1.0+0.2;}
function updateFoes(dt){
 G.melee=null;
 for(const e of G.lvl.ents){
  if(e.t!=='foe'||e.dead)continue;
  const dz=e.z-G.z;
  if(dz>40)break;
  if(!e.warned&&dz<34&&!G.demo){e.warned=true;G.foeWarn=2.2;sfx('horn',0.1);}
  const want=Math.min(FOE_MAXV,Math.ceil(e.n));
  while(e.units.length<want){const s=foeSlot(e,e.units.length,want);e.units.push({x:s[0],z:s[1]+(e.units.length<1?0:0),ph:Math.random()*8,k:(e.units.length%7===3)?1:(e.units.length%5===2)?2:0});}
  while(e.units.length>want){const u=e.units.pop();P(u.x,0.5,u.z,(Math.random()-.5)*4,3+Math.random()*3,(Math.random()-.5)*3,0.7,['#ff3a2a','#ffd0a0'][Math.random()*2|0],1.3,9);}
  e.flash=Math.max(0,e.flash-dt*4);
  const mm=e.units.length,cz=contactZ(e,mm);
  if(e.freeze>0)e.freeze-=dt;
  if(e.st==='idle'&&dz<17&&e.freeze<=0)e.st='rush';
  if(e.st==='rush'&&e.freeze<=0){e.z-=6*dt;e.x+=(G.x-e.x)*Math.min(1,dt*1.6);}
  if(e.st!=='fight'&&e.z<=cz+0.05){e.st='fight';e.fightT=0;sfx('hit',0.02);shake(5);
   G.rings.push({x:e.x,z:e.z-0.6,r:0.3,max:3.2,life:0.45,t:0,col:'255,230,170'});FL(G.x,2.4,G.z+1.6,'FIGHT!','#ffe27a',1.5,0.9);}
  if(e.st==='fight'){
   G.melee=e;e.fightT+=dt;
   e.z+=(cz-e.z)*Math.min(1,dt*8);e.x+=(G.x-e.x)*Math.min(1,dt*4);
   // ---- melee resolution: both armies trade blows; kill rate is capped so every fight lasts >= ~2s
   const ut=unitType();
   const wantKill=G.count*powerMul()*(1+ut*0.06)*0.85;
   const kill=Math.min(wantKill,e.n0/2.6)*(e.freeze>0?1.4:1)*Math.min(1,0.3+e.fightT*1.2);
   const hurtRate=e.freeze>0?0:e.n*e.fd*Math.min(1,0.35+e.fightT*1.4);
   const dEn=Math.min(e.n,kill*dt);
   e.n-=dEn;e.dmgAcc+=dEn;e.dmgT+=dt;
   e.acc+=hurtRate*dt;
   if(e.acc>=1){const k=Math.floor(e.acc);e.acc-=k;
    loseCount(k,G.x,G.z+1.2*crowdR(G.units.length),true);G.lossAcc2=(G.lossAcc2||0)+k;}
   // hit feedback
   G.hitT=(G.hitT||0)-dt;
   if(G.hitT<=0){G.hitT=0.055;
    const hx=G.x+(Math.random()-.5)*Math.max(0.8,crowdR(mm)*1.6),hz=G.z+1.2*crowdR(G.units.length)+0.3+Math.random()*0.3;
    burst(hx,0.5+Math.random()*0.7,hz,6,['#fff7b0','#ffd24a','#ffffff'][Math.random()*3|0],5,2.2,0.3,3);
    if(Math.random()<0.5)P(hx,0.8,hz,(Math.random()-.5)*2,2,(Math.random()-.5)*2,0.2,'#ff4a3a',2.4,0,2);
    G.shootT=Math.min(G.shootT,0);}

 else if(a.st===1){a.t+=dt;if(a.t>=a.dur){
   // impact

    for(const z of a.zones){if(u.x>=z.x0&&u.x<=z.x1&&Math.random()<Math.min(1,cfg.dmgP+b.enr*0.3)){const kk=Math.max(1,Math.round(G.count/G.units.length));killSprite(i,true);G.count=Math.max(0,G.count-kk);lost+=kk;break;}}}
   for(const z of a.zones){for(let i=0;i<22;i++)P(lerp(z.x0,z.x1,Math.random()),0.1,G.z+(Math.random()-.5)*4,(Math.random()-.5)*2,2+Math.random()*4,(Math.random()-.5)*2,0.8,['#ffcf8a','#fff','#c8a070'][i%3],1.5,8);}

function updateFx(dt){

 for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.t+=dt;r.r=lerp(r.r,r.max,Math.min(1,dt*5));if(r.t>=r.life)G.rings.splice(i,1);}

  if(th.snow&&Math.random()<dt*30)P(G.cam.x+(Math.random()-.5)*10,6+Math.random()*3,G.z+Math.random()*30,(Math.random()-.5),-1.5-Math.random(),-0.5,5,'#fff',1.1,0,2);

function botTarget(){
 const lim=limX(),R=Math.max(0.1,crowdR(G.units.length))*0.55;
 let nextGate=null;
 for(const e of G.lvl.ents){if(e.z<G.z-0.1)continue;if(e.z>G.z+22)break;if(e.t==='gate'&&!e.taken){nextGate=e.id;break;}}
 let best=G.x,bs=-1e18;
 const b=G.boss,a=b.atk;
 for(let cx=-lim;cx<=lim+1e-6;cx+=0.1){
  let sc=-Math.abs(cx-G.x)*0.6;
  for(const e of G.lvl.ents){
   const dz=e.z-G.z;if(dz<-0.6)continue;if(dz>22)break;
   switch(e.t){
    case 'gate':if(e.id===nextGate&&cx>=e.x0&&cx<=e.x1){const nc=applyOp(G.count,e.op,e.v);sc+=(nc-G.count)*4+ (nc>G.count?30:0);}break;
    case 'obs':if(!e.dead&&dz<8){const ox=e.k==='saw'?e.x:e.x,wd=e.w*0.5+(e.k==='saw'?e.amp:0)+R+0.12;if(e.k==='barrel'&&G.count>25)break;if(Math.abs(cx-ox)<wd)sc-=60*(1-dz/10);}break;
    case 'rec':if(!e.taken&&dz<14&&Math.abs(cx-e.x)<R+0.4)sc+=e.n*3;break;
    case 'coin':if(!e.taken&&dz<12&&Math.abs(cx-e.x)<R+0.35)sc+=1.5;break;
    case 'pow':if(!e.taken&&dz<14&&Math.abs(cx-e.x)<R+0.5)sc+=40;break;
    case 'blk':if(!e.taken&&dz<10&&Math.abs(cx-e.x)<R+0.6)sc+=e.v*1.2;break;
   }
  }
  if(G.phase==='boss'&&a.st===1){for(const z of a.zones){if(cx+R>z.x0&&cx-R<z.x1)sc-=300;}}
  if(sc>bs){bs=sc;best=cx;}
 }
 return best;
}

// ================= UI, input, main loop =================
const UI={screen:'sTitle',shopRet:'title',winCd:0,keys:{},drag:null,frames:[],frameMs:[]};
const SCREENS=['sTitle','sRounds','sShop','sWin','sLose','sPause'];
function showScreen(id){
 UI.screen=id;
 for(const s of SCREENS){$(s).classList.toggle('on',s===id);}
 $('hudbtns').classList.toggle('on',id===null&&!G.demo);
 const hint=$('hint');hint.classList.toggle('on',id===null&&!G.demo&&save.wins<2&&!G.hintDone&&(G.phase==='intro'||(G.phase==='run'&&G.runT<5)));
}
function refreshTitle(){
 $('tCoins').textContent=fmt(save.coins);$('tRound').textContent='Round '+save.round;
 $('tBest').textContent='Furthest: Round '+save.best+'  \u2022  Biggest crowd: '+fmt(save.bestCrowd);
}
function goTitle(){
 startRound(1+((Math.random()*6)|0),{demo:true});refreshTitle();showScreen('sTitle');AU.boss=false;
}
function playRound(r){
 auInit();auResume();G.hintDone=false;startRound(r);showScreen(null);
}
// ---- rounds ----
function renderRounds(){
 const g=$('rGrid');g.innerHTML='';const max=Math.max(15,save.round+3);
 $('rSub').textContent='Round '+save.round+' unlocked \u2022 endless rounds, tougher every time';
 for(let r=1;r<=max;r++){
  const th=(r-1)%3,locked=r>save.round,st=save.stars[r]||0;
  const d=document.createElement('div');d.className='card t'+(th+1)+(r===save.round?' cur':'')+(locked?' lock':'');
  d.innerHTML='<div class="n">'+r+'</div><div class="t">'+THEMES[th].id+'</div><div class="t" style="color:#ffd84a;font-size:.8em">'+(locked?'LOCKED':'\u2605'.repeat(st)+'\u2606'.repeat(3-st))+'</div>';
  if(!locked)d.onclick=()=>{sfx('click',0);playRound(r);};
  g.appendChild(d);
 }
}
// ---- shop ----
function renderShop(){
 $('shCoins').textContent=fmt(save.coins);
 const l=$('shList');l.innerHTML='';
 for(const k of ['power','start','income']){
  const u=UPG[k],lvl=save[k],cost=u.cost(lvl),max=lvl>=MAXUP;
  const row=document.createElement('div');row.className='up';
  let extra=k==='power'?'<br>'+UNIT_NAMES[unitType()]+' units':'';
  row.innerHTML='<div class="ic">'+u.ic+'</div><div class="tx"><div class="nm">'+u.name+' <span style="color:#ffd84a">Lv '+lvl+'</span></div><div class="ds">'+u.ds(lvl)+extra+'</div><div class="bar"><i style="width:'+Math.min(100,lvl/MAXUP*100)+'%"></i></div></div>';
  const b=document.createElement('button');b.className='btn gold';b.innerHTML=max?'MAX':'<span class="coin" style="width:.9em;height:.9em"></span> '+fmt(cost);
  b.disabled=max||save.coins<cost;
  b.onclick=()=>{if(save.coins>=cost&&!max){save.coins-=cost;save[k]++;persist();sfx('gate',0);renderShop();refreshTitle();}};
  row.appendChild(b);l.appendChild(row);
 }
 const go=$('shGo');go.textContent=UI.shopRet==='title'?'Back':('Play Round '+(UI.shopRet==='win'?G.round+1:G.round));
}
function openShop(from){UI.shopRet=from;UI.winCd=0;renderShop();showScreen('sShop');}
// ---- win / lose ----
function showWin(res){
 $('wR').textContent=res.round;$('wC1').textContent=res.collected;$('wC2').textContent=res.bonus;$('wMul').textContent=res.mul.toFixed(2);
 $('wC3').textContent='+'+Math.round((res.collected+res.bonus)*(res.mul-1));$('wTot').textContent=res.total;
 const st=$('wStars');st.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('div');s.className='star'+(i<res.stars?' on':'');s.style.animationDelay=(0.3+i*0.25)+'s';st.appendChild(s);}
 $('wNr').textContent='Round '+(res.round+1);UI.winCd=7;showScreen('sWin');refreshTitle();
}
function showLose(){
 const coins=finishLoseCoins();
 $('lR').textContent=G.round;$('lP').textContent=Math.round(clamp(G.z/G.lvl.L,0,1)*100)+'%';$('lC').textContent=coins;
 $('lWhy').textContent=G.boss.active?(G.boss.name+' has '+Math.round(G.boss.hp/G.boss.max*100)+'% HP left. Upgrade and try again!'):'The horde was crushed before the boss.';
 showScreen('sLose');refreshTitle();
}
// ---- wiring ----
function click(id,fn){$(id).addEventListener('click',()=>{auInit();auResume();sfx('click',0);fn();});}
click('bPlay',()=>playRound(save.round));
click('bRounds',()=>{renderRounds();showScreen('sRounds');});
click('rBack',()=>showScreen('sTitle'));
click('bShop',()=>openShop('title'));
click('shGo',()=>{if(UI.shopRet==='title')showScreen('sTitle');else if(UI.shopRet==='win')playRound(G.round+1);else playRound(G.round);});
click('wNext',()=>playRound(G.round+1));
click('wShop',()=>openShop('win'));
click('lRetry',()=>playRound(G.round));
click('lShop',()=>openShop('lose'));
click('lMenu',()=>goTitle());
click('pRes',()=>resume());
click('pRestart',()=>playRound(G.round));
click('pMenu',()=>goTitle());
function pause(){if(UI.screen===null&&(G.phase==='intro'||G.phase==='run'||G.phase==='boss')){G.paused=true;showScreen('sPause');}}
function resume(){G.paused=false;showScreen(null);}
$('btnPause').addEventListener('click',()=>{sfx('click',0);pause();});
document.querySelectorAll('.btnMute').forEach(b=>b.addEventListener('click',()=>{auInit();auResume();setMuted(!save.muted);sfx('click',0);}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('blur',()=>pause());
// ---- input ----
function dragStart(e){if(UI.screen!==null)return;auInit();auResume();UI.drag={id:e.pointerId,x0:e.clientX,tx0:G.tx};G.hintDone=true;$('hint').classList.remove('on');try{cv.setPointerCapture(e.pointerId);}catch(_){}}
function dragMove(e){const d=UI.drag;if(!d||d.id!==e.pointerId)return;setSteer(d.tx0+(e.clientX-d.x0)/VW*5.2);}
function dragEnd(e){if(UI.drag&&UI.drag.id===e.pointerId)UI.drag=null;}
cv.addEventListener('pointerdown',dragStart);cv.addEventListener('pointermove',dragMove);cv.addEventListener('pointerup',dragEnd);cv.addEventListener('pointercancel',dragEnd);
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
 UI.keys[e.code]=true;
 if(['ArrowLeft','ArrowRight','Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 auInit();auResume();
 if(e.code==='KeyP'||e.code==='Escape'){if(G.paused&&UI.screen==='sPause')resume();else pause();}
 if(e.code==='KeyM')setMuted(!save.muted);
 if(e.code==='Enter'||e.code==='Space'){
  if(UI.screen==='sTitle')$('bPlay').click();else if(UI.screen==='sWin')$('wNext').click();else if(UI.screen==='sLose')$('lRetry').click();else if(UI.screen==='sPause')$('pRes').click();}
 if(UI.screen===null&&['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)){G.hintDone=true;$('hint').classList.remove('on');}
});
window.addEventListener('keyup',e=>{UI.keys[e.code]=false;});
let padPrev=false;
function inputUpdate(dt){
 if(UI.screen!==null||G.auto||G.demo)return;
 const k=UI.keys;let dir=0;
 if(k.ArrowLeft||k.KeyA)dir-=1;if(k.ArrowRight||k.KeyD)dir+=1;
 let pads=null;try{pads=navigator.getGamepads?navigator.getGamepads():null;}catch(e){}
 if(pads){for(const p of pads){if(!p)continue;const ax=p.axes[0]||0;if(Math.abs(ax)>0.2)dir+=ax;if(p.buttons[14]&&p.buttons[14].pressed)dir-=1;if(p.buttons[15]&&p.buttons[15].pressed)dir+=1;}}
 if(dir){setSteer(G.tx+clamp(dir,-1,1)*5.5*dt);}
}
// ---- main loop ----
let lastT=performance.now(),accT=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=1/60;dt=Math.min(dt,0.1);
 const t0=performance.now();
 inputUpdate(dt);
 let n=Math.ceil(dt/(1/30)),sd=dt/n;
 for(let i=0;i<n;i++)update(sd);
 const t1=performance.now();
 render();
 const t2=performance.now();
 UI.frameMs.push(t2-t0);if(UI.frameMs.length>600)UI.frameMs.shift();
 UI.frames.push(dt*1000);if(UI.frames.length>600)UI.frames.shift();
 if(UI.screen==='sWin'&&UI.winCd>0){UI.winCd-=dt;$('wCd').textContent='Next round in '+Math.max(0,Math.ceil(UI.winCd))+'...';if(UI.winCd<=0){UI.winCd=0;$('wNext').click();}}
 else if(UI.screen==='sWin')$('wCd').textContent='';
 if(UI.screen===null){const hint=$('hint');if(hint.classList.contains('on')&&G.phase==='run'&&G.runT>5)hint.classList.remove('on');}
}
// ---- test hooks ----
window.__G={G,save,UI,startRound,update,render,botTarget,genLevel,playRound,goTitle,showScreen,
 sim(sec,auto){G.auto=auto!==false;const n=Math.round(sec*60);for(let i=0;i<n;i++){update(1/60);if(G.phase==='win'||G.phase==='lose')break;}return G.phase;},
 stats(){const a=UI.frameMs.slice().sort((x,y)=>x-y);const f=UI.frames;return{n:a.length,avgWork:a.reduce((s,v)=>s+v,0)/Math.max(1,a.length),p95Work:a[Math.floor(a.length*0.95)]||0,maxWork:a[a.length-1]||0,avgFrame:f.reduce((s,v)=>s+v,0)/Math.max(1,f.length)};}};
// ---- boot ----
window.addEventListener('resize',resize);
buildAllSprites();
setTheme(0);resize();
$('app').classList.toggle('muted',save.muted);
goTitle();
requestAnimationFrame(frame);

</script></body></html>
